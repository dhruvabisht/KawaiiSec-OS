menu title KawaiiSec OS - Cute & Secure Linux Distribution
menu background splash.png
menu color title	* #FFFFFFFF *
menu color border	* #00000000 #00000000 none
menu color sel		* #ffffffff #76a1d0ff *
menu color hotsel	1;7;37;40 #ffffffff #76a1d0ff *
menu color tabmsg	* #ffffffff #00000000 *
menu color help		37;40 #ffdddd00 #00000000 none
menu vshift 12
menu rows 10
menu helpmsgrow 15
menu timeoutrow 20
menu tabmsgrow 18
menu cmdlinerow 18
menu passwordrow 11
menu margin 8
menu hshift 0

label live-amd64
	menu label ^Live system (amd64)
	menu default
	linux /live/vmlinuz
	initrd /live/initrd.img
	append boot=live components locales=en_US.UTF-8 keyboard-layouts=us persistence-encryption=none quiet splash

label live-amd64-failsafe
	menu label Live system (amd64 - ^failsafe mode)
	linux /live/vmlinuz
	initrd /live/initrd.img
	append boot=live components locales=en_US.UTF-8 keyboard-layouts=us persistence-encryption=none memtest noapic noapm nodma nomce nolapic nomodeset nosmp nosplash vga=normal

label install-amd64
	menu label ^Install KawaiiSec OS
	linux /install/vmlinuz
	initrd /install/initrd.gz
	append vga=788 locales=en_US.UTF-8 keyboard-layouts=us --- quiet

label install-amd64-gtk
	menu label Install KawaiiSec OS (^graphical installer)
	linux /install/gtk/vmlinuz
	initrd /install/gtk/initrd.gz
	append video=vesa:ywrap,mtrr vga=788 locales=en_US.UTF-8 keyboard-layouts=us --- quiet

menu separator

label utilities
	menu label ^Utilities
	text help
		Boot utilities and diagnostic tools
	endtext
	menu begin utilities
		menu title Utilities
		label main
			menu label ^Back to main menu
			menu exit
		menu separator
		label memtest
			menu label ^Memory test
			linux /live/memtest
	menu end

menu separator

label hdt
	menu label ^Hardware Detection Tool
	com32 hdt.c32

label reboot
	menu label ^Reboot
	com32 reboot.c32

label poweroff
	menu label ^Power Off
	com32 poweroff.c32
